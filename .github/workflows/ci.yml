name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR checks may stop; accepted main/explicit candidates finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secret-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-pinned history scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable history without exposing findings
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --config .gitleaks.toml --redact=100 --no-banner
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Supports this source folder both at repository root and in its supplied wrapper.
      - name: Locate crate
        run: |
          if (Test-Path Cargo.toml) { "CRATE_DIR=." >> $env:GITHUB_ENV }
          elseif (Test-Path SwapCtx/Cargo.toml) { "CRATE_DIR=SwapCtx" >> $env:GITHUB_ENV }
          else { throw "Cannot locate SwapCtx Cargo.toml" }
      - name: Toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo fmt --check
      - name: Lint
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo test --locked --all-targets
      - name: Release build
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo build --locked --release
      - name: Release tests
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo test --locked --release --all-targets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: JSON and bridge contracts
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          node scripts/check-build-verification.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Strict build verification checks failed' }
          node scripts/check-sql.cjs
          if ($LASTEXITCODE -ne 0) { throw 'SQL checks failed' }
          $taskExecutable = if ($IsWindows) { 'target/release/swapctx.exe' } else { 'target/release/swapctx' }
          node scripts/check-context.cjs $taskExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Context checks failed' }
          node scripts/check-session.cjs $taskExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Session transport checks failed' }
          node scripts/check-everyday.cjs $taskExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Everyday integration checks failed' }
          node scripts/check-docs.cjs $taskExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Documentation checks failed' }
          node scripts/check-native.cjs $taskExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Native provider offline checks failed' }
          if ($IsWindows) {
            node scripts/third-party.cjs --check
            if ($LASTEXITCODE -ne 0) { throw 'Third-party notices are stale' }
            node scripts/check-package.cjs $taskExecutable
            if ($LASTEXITCODE -ne 0) { throw 'Windows package checks failed' }
            node scripts/check-windows-shells.cjs $taskExecutable
            if ($LASTEXITCODE -ne 0) { throw 'Windows shell compatibility checks failed' }
            node scripts/check-release.cjs $taskExecutable
            if ($LASTEXITCODE -ne 0) { throw 'Windows command discovery and PE checks failed' }
          }
          node scripts/check-pilot-harness.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Pilot evaluator checks failed' }
          node scripts/check-soak-harness.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Long-session evaluator checks failed' }
  windows-preview:
    # Runs the full offline gate internally; schedule independently of matrix results.
    # Merging still requires matrix, security, producer and recipient checks.
    # Retention below is private-only; no public distribution or release.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Provision pinned Rust and locked Windows dependencies
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain provisioning failed' }
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Dependency provisioning failed' }
      - name: Fresh offline Windows candidate and recipient acceptance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/prepare-preview.ps1 -Destination .build/ci-preview
          if ($LASTEXITCODE -ne 0) { throw 'Windows preview producer failed' }
          Get-Content .build/ci-preview/release-checks.json
          Get-Content .build/ci-preview/windows-acceptance.json
      - name: Retain exact verified candidate for private release review
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swapctx-windows-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: .build/ci-preview/
          if-no-files-found: error
          retention-days: 7
      # Public repositories never upload candidates through this workflow.
  windows-recipient:
    needs: windows-preview
    if: ${{ github.event.repository.private }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swapctx-windows-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/swapctx-recipient
          digest-mismatch: error
      - name: Verify original files and test on a separate Windows host
        shell: pwsh
        run: |
          $taskCandidate = Join-Path $env:RUNNER_TEMP 'swapctx-recipient'
          $taskHashes = @{}
          foreach ($taskLine in Get-Content -LiteralPath (Join-Path $taskCandidate 'SHA256SUMS.txt')) {
            if ($taskLine -cnotmatch '\A([0-9a-f]{64})  ([A-Za-z0-9_.-]+)\z') { throw 'Malformed checksum entry' }
            $taskExpected = $Matches[1]; $taskName = $Matches[2]
            if ($taskHashes.ContainsKey($taskName)) { throw 'Duplicate checksum entry' }
            $taskFile = Join-Path $taskCandidate $taskName
            if ((Get-Item -LiteralPath $taskFile).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Redirected candidate file' }
            if ((Get-FileHash -LiteralPath $taskFile -Algorithm SHA256).Hash -ine $taskExpected) { throw 'Candidate checksum mismatch' }
            $taskHashes[$taskName] = $taskExpected
          }
          if ($taskHashes.Count -ne 7) { throw 'Incomplete candidate checksums' }
          foreach ($taskName in @('install-windows.ps1','install-windows.cmd','test-windows-preview.ps1','build-info.json','release-checks.json','windows-acceptance.json')) {
            if (!$taskHashes.ContainsKey($taskName)) { throw 'Missing candidate evidence' }
          }
          $taskArchives = @(Get-ChildItem -LiteralPath $taskCandidate -Filter 'swapctx-*-windows-x64.zip' -File)
          if ($taskArchives.Count -ne 1 -or !$taskHashes.ContainsKey($taskArchives[0].Name)) { throw 'Expected one checksummed archive' }
          $taskPS = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $taskPS -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $taskCandidate 'test-windows-preview.ps1') -Archive $taskArchives[0].FullName -ExpectedSha256 $taskHashes[$taskArchives[0].Name] -Installer (Join-Path $taskCandidate 'install-windows.ps1') -InstallerSha256 $taskHashes['install-windows.ps1'] -WorkDirectory (Join-Path $env:RUNNER_TEMP 'recipient-work') -Report (Join-Path $env:RUNNER_TEMP 'independent-windows-acceptance.json')
          if ($LASTEXITCODE -ne 0) { throw 'Separate-host recipient acceptance failed' }
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'independent-windows-acceptance.json')
      - name: Retain separate-host acceptance evidence privately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-recipient-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/independent-windows-acceptance.json
          if-no-files-found: error
          retention-days: 7
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Locate crate
        shell: bash
        run: |
          if test -f Cargo.lock; then echo "CRATE_DIR=." >> "$GITHUB_ENV";
          elif test -f SwapCtx/Cargo.lock; then echo "CRATE_DIR=SwapCtx" >> "$GITHUB_ENV";
          else exit 1; fi
      - name: Install advisory auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo audit
