name: Foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  secret-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned history scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable history without exposing findings
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --config .gitleaks.toml --redact=100 --no-banner
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # Supports this source folder both at repository root and in its supplied wrapper.
      - name: Locate crate
        run: |
          if (Test-Path Cargo.toml) { "CRATE_DIR=." >> $env:GITHUB_ENV }
          elseif (Test-Path SwapCtx/Cargo.toml) { "CRATE_DIR=SwapCtx" >> $env:GITHUB_ENV }
          else { throw "Cannot locate SwapCtx Cargo.toml" }
      - name: Toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo fmt --check
      - name: Lint
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo test --locked --all-targets
      - name: Release build
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo build --locked --release
      - name: Release tests
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo test --locked --release --all-targets
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JSON and bridge contracts
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          node scripts/check-build-verification.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Strict build verification checks failed' }
          node scripts/check-sql.cjs
          if ($LASTEXITCODE -ne 0) { throw 'SQL checks failed' }
          $taskExecutable = if ($IsWindows) { 'target/release/swapctx.exe' } else { 'target/release/swapctx' }
          node scripts/check-context.cjs $taskExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Context checks failed' }
          node scripts/check-session.cjs $taskExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Session transport checks failed' }
          node scripts/check-everyday.cjs $taskExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Everyday integration checks failed' }
          node scripts/check-docs.cjs $taskExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Documentation checks failed' }
          node scripts/check-native.cjs $taskExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Native provider offline checks failed' }
          if ($IsWindows) {
            node scripts/third-party.cjs --check
            if ($LASTEXITCODE -ne 0) { throw 'Third-party notices are stale' }
            node scripts/check-package.cjs $taskExecutable
            if ($LASTEXITCODE -ne 0) { throw 'Windows package checks failed' }
            node scripts/check-release.cjs $taskExecutable
            if ($LASTEXITCODE -ne 0) { throw 'Windows command discovery and PE checks failed' }
          }
          node scripts/check-pilot-harness.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Pilot evaluator checks failed' }
          node scripts/check-soak-harness.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Long-session evaluator checks failed' }
  windows-preview:
    # Build/accept a disposable candidate; never upload or publish distribution files.
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Provision pinned Rust and locked Windows dependencies
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain provisioning failed' }
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Dependency provisioning failed' }
      - name: Fresh offline Windows candidate and recipient acceptance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/prepare-preview.ps1 -Destination .build/ci-preview
          if ($LASTEXITCODE -ne 0) { throw 'Windows preview producer failed' }
          Get-Content .build/ci-preview/release-checks.json
          Get-Content .build/ci-preview/windows-acceptance.json
      - name: Retain exact verified candidate for private release review
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: swapctx-windows-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: .build/ci-preview/
          if-no-files-found: error
          retention-days: 7
      # Public repositories never upload candidates through this workflow.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate crate
        shell: bash
        run: |
          if test -f Cargo.lock; then echo "CRATE_DIR=." >> "$GITHUB_ENV";
          elif test -f SwapCtx/Cargo.lock; then echo "CRATE_DIR=SwapCtx" >> "$GITHUB_ENV";
          else exit 1; fi
      - name: Install advisory auditor
        run: cargo install cargo-audit --locked
      - name: Audit locked dependencies
        working-directory: ${{ env.CRATE_DIR }}
        run: cargo audit
