name: Windows preview preparation (manual, no publication)
on:
  workflow_dispatch:
    inputs:
      retain_candidate:
        description: Retain unsigned candidate and run separate-host acceptance for 7 days
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline-preview:
    # Retained candidates must be built from the reviewed main revision.
    if: ${{ !inputs.retain_candidate || github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Locate source
        run: |
          if (Test-Path Cargo.toml) { 'CRATE_DIR=.' >> $env:GITHUB_ENV }
          elseif (Test-Path SwapCtx/Cargo.toml) { 'CRATE_DIR=SwapCtx' >> $env:GITHUB_ENV }
          else { throw 'Cannot locate Cargo.toml' }
      # Network provisioning is separate from the offline checks below.
      - name: Provision pinned toolchain and dependency cache
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain installation failed' }
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Dependency cache provisioning failed' }
      - name: Build and verify candidate offline
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/prepare-preview.ps1 -Destination .build/hosted-preview
          if ($LASTEXITCODE -ne 0) { throw 'Preview gates failed' }
      - name: Display local candidate evidence
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          Get-Content .build/hosted-preview/SHA256SUMS.txt
          Get-Content .build/hosted-preview/windows-acceptance.json
          Get-Content .build/hosted-preview/release-checks.json
      - name: Stage candidate for release review
        if: ${{ inputs.retain_candidate }}
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          Copy-Item -Recurse .build/hosted-preview "$env:RUNNER_TEMP/swapctx-preview"
      - name: Retain exact unsigned candidate
        if: ${{ inputs.retain_candidate }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swapctx-windows-preview-${{ github.sha }}
          path: ${{ runner.temp }}/swapctx-preview/
          retention-days: 7
          if-no-files-found: error
      # No release, package submission, commit, push or default upload step.

  windows-recipient:
    needs: offline-preview
    if: ${{ inputs.retain_candidate }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swapctx-windows-preview-${{ github.sha }}
          path: ${{ runner.temp }}/swapctx-recipient
          digest-mismatch: error
      - name: Verify original files and test on a separate Windows host
        shell: pwsh
        run: |
          $taskCandidate = Join-Path $env:RUNNER_TEMP 'swapctx-recipient'
          $taskHashes = @{}
          foreach ($taskLine in Get-Content -LiteralPath (Join-Path $taskCandidate 'SHA256SUMS.txt')) {
            if ($taskLine -cnotmatch '\A([0-9a-f]{64})  ([A-Za-z0-9_.-]+)\z') { throw 'Malformed checksum entry' }
            $taskExpected = $Matches[1]; $taskName = $Matches[2]
            if ($taskHashes.ContainsKey($taskName)) { throw 'Duplicate checksum entry' }
            $taskFile = Join-Path $taskCandidate $taskName
            if ((Get-Item -LiteralPath $taskFile).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Redirected candidate file' }
            if ((Get-FileHash -LiteralPath $taskFile -Algorithm SHA256).Hash -ine $taskExpected) { throw 'Candidate checksum mismatch' }
            $taskHashes[$taskName] = $taskExpected
          }
          if ($taskHashes.Count -ne 6) { throw 'Incomplete candidate checksums' }
          foreach ($taskName in @('install-windows.ps1','test-windows-preview.ps1','build-info.json','release-checks.json','windows-acceptance.json')) {
            if (!$taskHashes.ContainsKey($taskName)) { throw 'Missing candidate evidence' }
          }
          $taskArchives = @(Get-ChildItem -LiteralPath $taskCandidate -Filter 'swapctx-*-windows-x64.zip' -File)
          if ($taskArchives.Count -ne 1 -or !$taskHashes.ContainsKey($taskArchives[0].Name)) { throw 'Expected one checksummed archive' }
          $taskPS = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $taskPS -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $taskCandidate 'test-windows-preview.ps1') -Archive $taskArchives[0].FullName -ExpectedSha256 $taskHashes[$taskArchives[0].Name] -Installer (Join-Path $taskCandidate 'install-windows.ps1') -InstallerSha256 $taskHashes['install-windows.ps1'] -WorkDirectory (Join-Path $env:RUNNER_TEMP 'recipient-work') -Report (Join-Path $env:RUNNER_TEMP 'independent-windows-acceptance.json')
          if ($LASTEXITCODE -ne 0) { throw 'Separate-host recipient acceptance failed' }
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'independent-windows-acceptance.json')
      - name: Retain separate-host acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-recipient-${{ github.sha }}
          path: ${{ runner.temp }}/independent-windows-acceptance.json
          if-no-files-found: error
          retention-days: 7
