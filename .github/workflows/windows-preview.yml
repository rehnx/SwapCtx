name: Windows preview preparation (manual, no publication)
on:
  workflow_dispatch:
    inputs:
      retain_candidate:
        description: Retain the tested candidate for 7 days inside this private repository
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  offline-preview:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Locate source
        run: |
          if (Test-Path Cargo.toml) { 'CRATE_DIR=.' >> $env:GITHUB_ENV }
          elseif (Test-Path SwapCtx/Cargo.toml) { 'CRATE_DIR=SwapCtx' >> $env:GITHUB_ENV }
          else { throw 'Cannot locate Cargo.toml' }
      # Network provisioning is separate from the offline checks below.
      - name: Provision pinned toolchain and dependency cache
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain installation failed' }
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Dependency cache provisioning failed' }
      - name: Build and verify candidate offline
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/prepare-preview.ps1 -Destination .build/hosted-preview
          if ($LASTEXITCODE -ne 0) { throw 'Preview gates failed' }
      - name: Display local candidate evidence
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          Get-Content .build/hosted-preview/SHA256SUMS.txt
          Get-Content .build/hosted-preview/windows-acceptance.json
          Get-Content .build/hosted-preview/release-checks.json
      - name: Stage candidate for private maintainer review
        if: ${{ inputs.retain_candidate }}
        working-directory: ${{ env.CRATE_DIR }}
        run: |
          if ('${{ github.event.repository.private }}' -ne 'true') { throw 'Candidate retention requires a private repository; public distribution is not authorized by this workflow' }
          Copy-Item -Recurse .build/hosted-preview "$env:RUNNER_TEMP/swapctx-preview"
      - name: Retain verified candidate privately
        if: ${{ inputs.retain_candidate && github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swapctx-windows-preview-${{ github.sha }}
          path: ${{ runner.temp }}/swapctx-preview/
          retention-days: 7
          if-no-files-found: error
      # No release, package submission, commit, push or default upload step.
