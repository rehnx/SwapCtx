[package]
name = "swapctx"
version = "0.1.0"
edition = "2021"
description = "Local-first context records and project protection rules for coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
