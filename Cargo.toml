[package]
name = "swapctx"
version = "0.1.0-preview"
edition = "2021"
description = "Local-first context records and project protection rules for coding agents"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/rehnx/SwapCtx"
homepage = "https://github.com/rehnx/SwapCtx"
keywords = ["cli", "ai", "context", "memory", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
tempfile = "3"
sha2 = "0.10"
